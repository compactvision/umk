name: Deploy to Nitrohost

on:
  workflow_dispatch:
    inputs:
      change_reference:
        description: Référence de la décision de mise en production
        required: true
        type: string
      restore_verified:
        description: Sauvegarde et restauration vérifiées pour cette mise en production
        required: true
        type: boolean
      rollback_compatible:
        description: La release précédente fonctionne avec le schéma après migration
        required: true
        type: boolean

concurrency:
  group: umk-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    if: github.ref == 'refs/heads/main' && inputs.change_reference != '' && inputs.restore_verified && inputs.rollback_compatible
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: validation
    environment: production
    runs-on: ubuntu-latest
    env:
      RELEASE_DIR: release-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      # ----- PHP (Composer) -----
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, bcmath, gd, pdo_mysql, pdo_pgsql, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-interaction

      - name: Install PHP deps (no-dev)
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader

      # ----- Node (build Inertia/Vite) -----
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install JS deps & Build
        run: |
          npm ci
          npm run build

      # ----- Préparer une release prête à déposer -----
      - name: Prepare release folder
        run: |
          mkdir -p $RELEASE_DIR
          rsync -a --delete \
            --exclude=".git" --exclude=".github" \
            --exclude="node_modules" --exclude="storage" --exclude=".env*" --exclude="release-*" --exclude="bootstrap/cache/*.php" --exclude="tests" --exclude="docs" --exclude="/public/hot" --exclude=".phpunit.result.cache" --exclude="*.sqlite*" \
            ./ $RELEASE_DIR/

      # ----- Upload vers le serveur (SCP) -----
      - name: Upload release via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NITRO_HOST }}
          port: ${{ secrets.NITRO_PORT }}
          username: ${{ secrets.NITRO_USER }}
          key: ${{ secrets.NITRO_SSH_KEY }}
          # ou password: ${{ secrets.NITRO_PASS }}
          source: "${{ env.RELEASE_DIR }}/"
          target: "${{ secrets.NITRO_PATH }}/releases/${{ github.sha }}/"
          overwrite: true
          strip_components: 1

      # ----- Activer la release (liens + caches + migration + bascule) -----
      - name: Activate release
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.NITRO_HOST }}
          port: ${{ secrets.NITRO_PORT }}
          username: ${{ secrets.NITRO_USER }}
          key: ${{ secrets.NITRO_SSH_KEY }}
          # ou password: ${{ secrets.NITRO_PASS }}
          script: |
            set -e
            BASE="${{ secrets.NITRO_PATH }}"
            REL="${{ secrets.NITRO_PATH }}/releases/${{ github.sha }}"

            # Lier éléments "shared"
            test -f "$BASE/shared/.env"
            test -d "$BASE/shared/storage"
            ln -sfnT "$BASE/shared/.env" "$REL/.env"
            ln -sfnT "$BASE/shared/storage" "$REL/storage"
            # Le cache de configuration appartient à la release, pas au répertoire partagé.
            mkdir -p "$REL/bootstrap/cache"

            # Optimisations / migrations
            cd "$REL"
            # APP_KEY doit être provisionnée une seule fois dans shared/.env.
            ${{ secrets.PHP_CLI }} artisan config:clear
            ${{ secrets.PHP_CLI }} artisan app:preflight --production --assets
            ${{ secrets.PHP_CLI }} artisan config:cache
            ${{ secrets.PHP_CLI }} artisan route:cache
            ${{ secrets.PHP_CLI }} artisan view:cache
            ${{ secrets.PHP_CLI }} artisan migrate --force
            ${{ secrets.PHP_CLI }} artisan app:preflight --production --database --assets --runtime

            # Lien temporaire dans le même répertoire pour un remplacement atomique.
            PREVIOUS=$(readlink "$BASE/current" || true)
            NEXT="$BASE/.current-next-$$"
            trap 'test ! -L "$NEXT" || unlink "$NEXT"' EXIT
            switch_release() {
              ln -s "$1" "$NEXT"
              mv -Tf "$NEXT" "$BASE/current"
            }
            switch_release "$REL"

            if ! { ${{ secrets.PHP_CLI }} artisan queue:restart &&
              ${{ secrets.PHP_CLI }} artisan app:preflight --production --database --assets --http; }; then
              if [ -n "$PREVIOUS" ]; then
                switch_release "$PREVIOUS"
                cd "$BASE/current"
                ${{ secrets.PHP_CLI }} artisan queue:restart
              elif [ "$(readlink "$BASE/current")" = "$REL" ]; then
                unlink "$BASE/current"
              fi
              exit 1
            fi
